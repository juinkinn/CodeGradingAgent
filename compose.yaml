services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-codegrading}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-codegrading-dev-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /data/codegrading.db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-codegrading}:${RABBITMQ_PASSWORD:-codegrading-dev-password}@rabbitmq:5672/%2F
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.submission_upload"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /data/codegrading.db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-codegrading}:${RABBITMQ_PASSWORD:-codegrading-dev-password}@rabbitmq:5672/%2F
    volumes:
      - backend_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  rabbitmq_data:
