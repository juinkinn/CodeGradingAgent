services:
  - type: web
    name: codegrading-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL=https://$API_HOST npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: codegrading-backend
          property: host

  - type: web
    name: codegrading-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python render_start.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_PATH
        value: /tmp/codegrading.db
      - key: RABBITMQ_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: LANGFUSE_PROMPT_LABEL
        value: production
      - key: OTEL_SERVICE_NAME
        value: codegradingagent-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: SUBMISSION_UPLOAD_QUEUE
        value: submission_uploads
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_SESSION_MAX_AGE
        value: "1209600"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: codegrading-frontend
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: codegrading-frontend
          property: host
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
